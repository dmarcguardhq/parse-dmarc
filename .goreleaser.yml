# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: parse-dmarc

env:
  - GITHUB_TOKEN
  - HOMEBREW_TAP_GITHUB_TOKEN
  - COSIGN_EXPERIMENTAL=true

before:
  hooks:
    - go mod download
    - go mod verify
    - bun install --frozen-lockfile
    - bun run build
    - rm -rf internal/api/dist
    - mv dist internal/api/

builds:
  - binary: parse-dmarc
    main: .
    env:
      - CGO_ENABLED=0
    flags:
      - "-trimpath"
    ldflags:
      - "-s"
      - "-w"
      - "-extldflags '-static'"
      - "-X main.version={{.Version}}"
      - "-X main.commit={{.Commit}}"
      - "-X main.date={{.Date}}"
      - "-X main.builtBy=goreleaser"
    ignore:
      - goarch: arm
        goos: windows
      - goarch: arm64
        goos: windows

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - formats:
          - zip
        goos: windows
    name_template: >-
      {{ .ProjectName }}_
      {{- tolower .Os }}_
      {{- if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

dist: .goreleaser-dist

dockers_v2:
  - id: parse-dmarc
    images:
      - dmarcguard/parse-dmarc
      - ghcr.io/dmarcguardhq/parse-dmarc
      # NOTE: keeping only for backward compatibility to avoid breaking old
      # clients pulling the images from the previous renames.
      - dmarcguard/dmarcguard
      - ghcr.io/dmarcguardhq/dmarcguard
      - meysam81/parse-dmarc
    dockerfile: Dockerfile.goreleaser
    tags:
      - "{{ if not .IsSnapshot }}v{{ .Version }}{{ end }}"
      - "{{ if not .IsSnapshot }}v{{ .Major }}{{ end }}"
      - "{{ if not .IsSnapshot }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .IsSnapshot }}v{{ .Major }}.{{ .Minor }}.{{ .Patch }}{{ end }}"
      - "{{ .FullCommit }}"
      - "{{ if .IsNightly }}latest{{ end }}"
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.description": "DMARC aggregate report parser with a built-in dashboard. One Go binary, IMAP in, SQLite, Prometheus metrics, MCP server. Apache-2.0."
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "io.modelcontextprotocol.server.name": "io.github.meysam81/parse-dmarc"

docker_signs:
  - id: default
    cmd: cosign
    args:
      - "sign"
      - "--yes"
      - "${artifact}"
    output: true

docker_digest:
  name_template: "digest.txt"
  disable: "{{ .Env.NO_DIGEST }}"

homebrew_casks:
  - name: parse-dmarc
    description: Single-binary, zero-dependency DMARC parser with a modern web dashboard.
    homepage: https://github.com/dmarcguardhq/parse-dmarc
    license: Apache-2.0
    commit_msg_template: Brew formula update for {{ .ProjectName }} version {{ .Tag }}
    repository:
      name: homebrew-tap
      owner: dmarcguardhq
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/parse-dmarc"]
          end
          puts "✨ parse-dmarc installed successfully!"
          puts ""
          puts "📝 Tip: You can enable shell completion by running:"
          puts "   parse-dmarc completion bash  # for bash"
          puts "   parse-dmarc completion zsh   # for zsh"
          puts "   parse-dmarc completion fish  # for fish"
          puts ""
          puts "📚 For more information and usage instructions, visit:"
          puts "   https://github.com/dmarcguardhq/parse-dmarc"
  # NOTE: legacy tap so `brew tap meysam81/tap` users keep upgrading; drop once the old tap is archived
  - name: parse-dmarc
    description: Single-binary, zero-dependency DMARC parser with a modern web dashboard.
    homepage: https://github.com/dmarcguardhq/parse-dmarc
    license: Apache-2.0
    commit_msg_template: Brew formula update for {{ .ProjectName }} version {{ .Tag }}
    repository:
      name: homebrew-tap
      owner: meysam81
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/parse-dmarc"]
          end
          puts "✨ parse-dmarc installed successfully!"
          puts ""
          puts "📝 Tip: You can enable shell completion by running:"
          puts "   parse-dmarc completion bash  # for bash"
          puts "   parse-dmarc completion zsh   # for zsh"
          puts "   parse-dmarc completion fish  # for fish"
          puts ""
          puts "📚 For more information and usage instructions, visit:"
          puts "   https://github.com/dmarcguardhq/parse-dmarc"

nix:
  # Binary package for Nix users, same model as the brew tap: goreleaser
  # renders pkgs/parse-dmarc/default.nix (fetchurl of the release archives +
  # per-platform sha256) into dmarcguardhq/nur, whose flake.nix exposes it as
  # `nix run github:dmarcguardhq/nur#parse-dmarc`. Needs nix-hash on PATH
  # (install-nix-action in ci.yml); without it the pipe is skipped, not failed.
  - name: parse-dmarc
    repository:
      owner: dmarcguardhq
      name: nur
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/dmarcguardhq/parse-dmarc
    description: Single-binary, zero-dependency DMARC parser with a modern web dashboard.
    license: asl20
    commit_msg_template: Nix package update for {{ .ProjectName }} version {{ .Tag }}
    extra_install: installShellCompletion --cmd parse-dmarc --bash <($out/bin/parse-dmarc completion bash) --zsh <($out/bin/parse-dmarc completion zsh) --fish <($out/bin/parse-dmarc completion fish)

report_sizes: true

release:
  # release-please creates the GitHub release with the changelog; goreleaser
  # appends the install/verify footer rendered from .github/release-notes.md
  # (passed via --release-notes-tmpl in ci.yml, which bypasses the changelog
  # pipe so nothing is duplicated).
  mode: append

milestones:
  - close: true
    fail_on_error: false
    name_template: "{{ .Tag }}"

announce:
  skip: "{{gt .Patch 0}}"

checksum:
  algorithm: sha256
  name_template: checksums.txt
