repos:
  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: 50c9254f606c6121317d2290079442d162224224 # frozen: v1.92.0
    hooks:
      - id: oxlint
        verbose: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5000"]
        exclude: |
          (?x)^(
            assets/.*
          )$
      - id: check-ast
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
        args:
          - --allow-multiple-documents
      - id: detect-private-key
        exclude: |
          (?x)^(
          )$
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
          )$
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: file-contents-sorter
      - id: fix-byte-order-marker
      - id: fix-encoding-pragma
      - id: forbid-new-submodules
      - id: forbid-submodules
      - id: mixed-line-ending
      - id: name-tests-test
      - id: requirements-txt-fixer
      - id: sort-simple-yaml
      - id: trailing-whitespace
      - id: pretty-format-json
        args:
          - --autofix
        exclude: |
          (?x)^(
            manifest.json|
            .oxlintrc.json|
            renovate.json
          )$
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: 1f1ac45c93d1c2ce36b71330252c489a5f4f2724 # frozen: v9.27.0
    hooks:
      - id: commitlint
        language: node
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@21.2.4"]
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: fb24a639f7c938759fe56eeebbb7713b69d60494 # frozen: v0.5.1
    hooks:
      - id: go-fmt
      # - id: go-vet
      # - id: go-lint
      - id: go-imports
      # - id: go-cyclo
      #   args: [-over=15]
      - id: no-go-testing
      - id: golangci-lint
      # - id: go-critic
      # - id: go-unit-tests
      # - id: go-build
      - id: go-mod-tidy
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/reteps/dockerfmt
    rev: d096f3231fc6eadc7009f63ee6cdc913b626e9ad # frozen: v0.6.0
    hooks:
      - id: dockerfmt
        args:
          - --indent=4
  - repo: https://github.com/thlorenz/doctoc
    rev: 59dcae910a6ad4bbe8711275b854e3cd5c30f08b # frozen: v2.5.0
    hooks:
      - id: doctoc
        files: ^README.md$
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        pass_filenames: true
        entry: bunx prettier -u --write
