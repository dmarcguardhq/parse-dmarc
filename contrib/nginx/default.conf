# Serve parse-dmarc under /dmarc/ alongside other sites on one host.
server {
    listen 80;

    # Redirect /dmarc to /dmarc/ with a relative Location, so the redirect
    # keeps whatever host and port the browser used.
    absolute_redirect off;

    # The trailing slash on proxy_pass strips /dmarc/ before forwarding: the
    # app sees /, /assets/... and /api/... exactly as when served at the root.
    location /dmarc/ {
        proxy_pass http://parse-dmarc:8080/;
    }
}
