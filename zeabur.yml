      - 🔧 內置 DNS 記錄生成器，便於輕鬆設置 DMARC
      - 📦 單個二進制文件 - 無需安裝數據庫
      - 🚀 極小的 14MB Docker 鏡像
      - 🔒 安全的 TLS 支持
      - 🌙 深色模式支持

      ## 快速開始

      部署後，您需要：

      1. 在您的域上設置 DMARC DNS 記錄
      2. 配置 IMAP 憑據以獲取報告
      3. 訪問儀表板查看 DMARC 報告

      完整文檔請訪問 https://github.com/dmarcguardhq/parse-dmarc
